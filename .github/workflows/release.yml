name: release

# Push a v* tag to publish a release with an Apple silicon binary.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked
      - run: |
          cargo build --release --locked
          cp target/release/ghimby ghimby-darwin-arm64
      - run: gh release create "$GITHUB_REF_NAME" ghimby-darwin-arm64 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
